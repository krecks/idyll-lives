[package]
name = "ll-tools"
description = "The repo's command-line tools: the resident generator, the object gate and Blender runner, the content editor, the texture scripts, the authenticity review, and the release work (version, licences, wasm-opt, the model fetches). Never shipped."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
bytemuck = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
nalgebra = "0.35"
regex = "1"
sha2 = "0.10"
similar = "3"
sim-core = { path = "../sim-core" }
ureq = "3"
