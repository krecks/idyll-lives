[package]
name = "ll-tools"
description = "The repo's command-line tools: the resident generator, the object gate and Blender runner, the content editor and the texture scripts. Never shipped."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nalgebra = "0.35"
regex = "1"
similar = "3"
ureq = "3"
