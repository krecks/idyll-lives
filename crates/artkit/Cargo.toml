[package]
name = "artkit"
description = "The kernel the game's item models are generated with: meshes, shapes, forms, shading, clips and the .glb writer. No file access, no threads: only what a build computes."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
# sin, cos, pow and the rest in software, so a build gives the same bytes on every machine.
libm = "0.2"
