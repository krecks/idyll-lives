# WASM SIMD is supported by every desktop browser we target. A RUSTFLAGS in the environment
# replaces these flags instead of adding to them: the wasm crates then refuse to build without SIMD.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# The repo's tools (crates/tools), run from the repo root. Their Python and JavaScript predecessors
# are gone. The release and fetch tools (decoders, fetch-llm, fetch-voice, licenses, release-version,
# wasm-opt) are unoptimised: they wait on the network or on binaryen, so a release build would only
# cost minutes of compiling. The rest build in the `tools` profile (Cargo.toml: release without fat
# LTO), as their tests do.
[alias]
art = "run -q -p ll-tools --profile tools --bin art --"
assets = "run -q -p ll-tools --profile tools --bin assets --"
characters = "run -q -p ll-tools --profile tools --bin characters --"
check-chunks = "run -q -p ll-tools --profile tools --bin check-chunks --"
check-glb = "run -q -p ll-tools --profile tools --bin check-glb --"
content = "run -q -p ll-tools --profile tools --bin content --"
review = "run -q -p ll-tools --profile tools --bin review --"
shots = "run -q -p ll-tools --profile tools --bin shots --"
tex = "run -q -p ll-tools --profile tools --bin tex --"
decoders = "run -q -p ll-tools --bin decoders --"
envconv = "run -q -p ll-tools --profile tools --bin envconv --"
fetch-llm = "run -q -p ll-tools --bin fetch-llm --"
fetch-voice = "run -q -p ll-tools --bin fetch-voice --"
licenses = "run -q -p ll-tools --bin licenses --"
pins = "run -q -p ll-tools --profile tools --bin pins --"
release-version = "run -q -p ll-tools --bin release-version --"
wasm-opt = "run -q -p ll-tools --bin wasm-opt --"
world-map = "run -q -p ll-tools --profile tools --bin world-map --"
