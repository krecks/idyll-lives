[workspace]
resolver = "3"
members = ["crates/art", "crates/art/nature", "crates/art/outside", "crates/art/packs", "crates/art/rooms", "crates/art/things", "crates/art/wet", "crates/artkit", "crates/sim-core", "crates/sim-wasm", "crates/sound", "crates/sound-wasm", "crates/tools", "crates/voice", "crates/voice-wasm"]

[workspace.package]
edition = "2024"
version = "0.9.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tests are the only dev builds (the wasm builds are release); unoptimised, the simulation made
# the sim-core suite take minutes.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The generated-world checks (tools/ci-local.sh `generated`): days of big towns ticked, so optimised as the
# tools are, with the dev build's assertions and overflow checks kept (the ticks are the same to the bit).
[profile.checks]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"

# The repo's tools (crates/tools): the aliases in .cargo/config.toml, their tests and CI's tools job.
# Release's optimisations without its fat LTO, in 16 codegen units and incremental, so a change to the
# tools builds again in seconds where fat LTO took about a minute; their outputs are the same to the
# byte, and they run about as fast. (Release itself stays as it is for the wasm builds.)
[profile.tools]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
# (a length read from a file is not trusted: a product that wraps is a slice to the wrong place, not a small number)
overflow-checks = true
# (`cargo art` builds a thread a model and says which one failed: a panic unwinds to it.)
panic = "unwind"

# The generated models' families (crates/art/*): thousands of lines of calls, changed and built again all day, so
# lightly optimised; the kernel they call (artkit) keeps the profile's level.
[profile.tools.package.art-nature]
opt-level = 1
[profile.tools.package.art-outside]
opt-level = 1
[profile.tools.package.art-packs]
opt-level = 1
[profile.tools.package.art-rooms]
opt-level = 1
[profile.tools.package.art-things]
opt-level = 1
[profile.tools.package.art-wet]
opt-level = 1
