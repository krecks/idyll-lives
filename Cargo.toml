[workspace]
resolver = "3"
members = ["crates/sim-core", "crates/sim-wasm", "crates/tools", "crates/voice", "crates/voice-wasm"]

[workspace.package]
edition = "2024"
version = "0.4.2"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tests are the only dev builds (the wasm builds are release); unoptimised, the simulation made
# the sim-core suite take minutes.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
