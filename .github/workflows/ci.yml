# Checks every push to main and every pull request: clippy (the release gate) and the simulation's
# tests, then the ignored sample tests that need files made first, the residents' clip check, the
# renderer's quick checks (the PlayCanvas internals it relies on, its tests) and the tools' tests.
# The heavy release work — the wasm builds, models, the other web checks and Pages deploy — stays in
# pages.yml, run by hand or on a tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Simulation tests
        run: cargo test -p sim-core --locked

      # Bun runs the clip check (no packages) and the renderer's checks (packages installed for them).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # The generated_* tests are ignored because they need sample files; make them here so they
      # run instead of passing without checking anything.
      - name: Generated houses and worlds
        # In the simulation tests' own build (already optimised, `opt-level = 1`, and built by the
        # step before): a release build of the whole test binary would cost more than it saves.
        run: |
          bun tools/housegen/sample.ts /tmp/houses.json
          # Cosy and Normal worlds three per kind, Big ones (up to 1024 m) one per kind in a file of their own.
          bun tools/worlds/sample.ts /tmp/worlds.json 3 --sizes cosy,normal,big --big-per-kind 1 --big-out /tmp/worlds-big.json
          HOUSES=/tmp/houses.json WORLDS=/tmp/worlds.json cargo test -p sim-core --locked --test sim -- --ignored generated_houses:: generated_worlds::
          WORLDS=/tmp/worlds-big.json cargo test -p sim-core --locked --test sim -- --ignored generated_worlds::

      # The residents' clips on both bodies at every life stage; the known failures are in
      # tools/characters/clip-baseline.json, so only a new one fails.
      - name: Clip check
        working-directory: web
        run: bun run check:clips

      # The renderer: the PlayCanvas shader chunks' anchor lines and private names it patches or
      # reads, in the pinned release build (tools/render/check_chunks.ts), and its engine-neutral
      # tests (web/tests, `bun test`). Neither needs the wasm builds.
      - name: Install web packages
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Shader chunks and renderer tests
        working-directory: web
        run: |
          bun run check:chunks
          bun run test

      # The repo's tools (crates/tools): a fresh character build against the committed set and its
      # checks, the object gate over every shipped model (no Blender), and the content and texture
      # tools. Release, as the character build is slow unoptimised (without fat LTO, as above).
      - name: Tool tests
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo test -p ll-tools --release --locked

      # Every shipped model against the reference's kinds: a content object no kind covers (a new
      # thing nobody sized) fails, where a measure outside its range is the review's to weigh.
      - name: Object sizes
        run: |
          set -o pipefail
          cargo review sizes | tee /tmp/review-sizes.md

      # Every use the renderer can play and every open that has its clip: a use whose animation
      # `ACTIONS` has no entry for, a `motions` key no use answers to, an open without
      # `motions.open` fails. An object with no use of its own, a duration out of the median and a
      # sound only another kind makes stay the review's to weigh (the summary counts them).
      - name: Object uses
        run: |
          set -o pipefail
          cargo review uses --check | tee /tmp/review-uses.md

      # Every shipped model at the gate (no Blender): a clip that does not run rest to rest, a part that
      # moves without one, a budget over, a functional height (seat, top, mattress, lamp) the mesh and the
      # content disagree on. A measure out of range is the review's to weigh; a broken model fails here.
      - name: Models
        run: |
          set -o pipefail
          cargo check-glb | tee /tmp/check-glb.txt
