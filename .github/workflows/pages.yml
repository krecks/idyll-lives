# Builds the game and publishes it on GitHub Pages: https://<owner>.github.io/<repo>/
# Runs when a release tag (`v0.2.0`) is pushed (and by hand from the Actions tab); pushes to
# main alone don't publish. The github-pages environment must allow `v*` tags to deploy.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Version check (web and Rust must match, and the tag if there is one)
        run: |
          version=$(node tools/release/version.mjs)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} doesn't match version $version"; exit 1
          fi

      - name: Simulation tests
        run: cargo test -p sim-core

      # Compressed asset copies (tools/assets/optimize.mjs, run by the build), cached by content
      # hash so only changed files are encoded again.
      - uses: actions/cache@v4
        with:
          path: web/.assets/cache
          key: assets-${{ hashFiles('tools/assets/optimize.mjs', 'web/public/assets/**') }}
          restore-keys: assets-

      - name: Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm voice
          pnpm check:voice
          pnpm check
          pnpm lint
          pnpm exec vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
