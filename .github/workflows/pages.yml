# Builds the game and publishes it on GitHub Pages: https://<owner>.github.io/<repo>/
# Runs when a release tag (`v0.2.0`) is pushed, and by hand from the Actions tab or with
# `gh workflow run pages.yml --ref <branch>`: by hand it builds and checks everything, a dry run of
# the release, and publishes only with `-f deploy=true`. Pushes to main alone don't publish. The
# github-pages environment must allow `v*` tags (and any branch that is deployed by hand).
# Run it by hand on main just before tagging: caches saved by a tag run can't be read by the next
# tag, those saved on main can (and only main saves the Rust one, which is most of the size).
#
# The tests are CI's (ci.yml), not run again here: fmt, clippy, the simulation and the tools' tests,
# the shader chunks and the renderer tests. A deploy waits for CI to pass on the same commit instead
# (the `ci` job): on a tag the tag's own CI run, which has the generated worlds and the slow tests
# too and runs beside this build; by hand with deploy, a CI run on the commit that passed (a push to
# main, a pull request's or one by hand). What only a release build can check stays here: the
# version, the voice's tests and check, the web's types and lint, the build and its size.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the build on GitHub Pages (otherwise build and check only)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  # (The `ci` job reads CI's runs.)
  actions: read

# One run at a time; a second one waits rather than cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # No RUSTFLAGS here: it would replace .cargo/config.toml's SIMD flag (the wasm crates then
    # stop with a compile error), so a flag added here must repeat `-C target-feature=+simd128`.
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      # The version pinned in rust-toolchain.toml, with the wasm32 target.
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
      # (Saved on main only: see the top.)
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Must match the wasm-bindgen crate version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Version check (web, Rust and Cargo.lock match; on a release tag, the tag and CHANGELOG.md too)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo release-version)
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then echo "::error::Tag $REF_NAME doesn't match version $version"; exit 1; fi
            if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then echo "::error::CHANGELOG.md has no '## $version' heading"; exit 1; fi
          fi
          echo "Version $version"

      # Compressed asset copies (cargo assets, run by the build), cached by content
      # hash so only changed files are encoded again.
      - uses: actions/cache@v6
        with:
          path: web/.assets/cache
          key: assets-rs-${{ hashFiles('crates/tools/src/assets.rs', 'crates/tools/src/assets/**', 'Cargo.lock', 'web/public/assets/**') }}
          restore-keys: assets-rs-

      # wasm-opt's results (each entry keyed by its input's SHA-256, binaryen's version and the
      # flags), so a release doesn't spend a minute optimising the same wasm again; the named
      # artifact below keeps its own entries in the same folder.
      - uses: actions/cache@v6
        with:
          # (The two folders only: entries from before they existed stay behind.)
          path: |
            web/.assets/wasm-opt/release
            web/.assets/wasm-opt/names
          # (A new key every run: a cache hit on the exact key is never saved again, so new wasm
          # builds' results would never be kept.)
          key: wasm-opt-${{ github.run_id }}
          restore-keys: wasm-opt-

      # The voice model and dictionary (about 400 MB from Hugging Face and GitHub, stored as
      # 87 MB) and the language model (about 200 MB), kept between runs so a release doesn't
      # depend on those sites. The fetch tools (cargo fetch-voice, cargo fetch-llm) check every
      # file's SHA-256 and fetch again what doesn't match, so an old cache can't slip through.
      - uses: actions/cache@v6
        with:
          path: web/public/voice
          key: voice-${{ hashFiles('crates/tools/src/voicefetch.rs', 'crates/tools/src/fp16.rs', 'crates/tools/src/int8.rs', 'crates/tools/src/download.rs') }}
          restore-keys: voice-
      - uses: actions/cache@v6
        with:
          path: web/public/llm
          key: llm-${{ hashFiles('crates/tools/src/llmfetch.rs', 'crates/tools/src/llmslim.rs', 'crates/tools/src/download.rs') }}
          restore-keys: llm-

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: WebAssembly, voice model and language model
        working-directory: web
        run: |
          bun run wasm
          bun run voice
          bun run llm

      # With CI set, a missing dictionary fails these instead of skipping them.
      - name: Voice tests
        run: cargo test -p voice --release --locked

      - name: Checks
        working-directory: web
        run: |
          bun run check:voice
          bun run check
          bun run lint

      # Also optimises the wasm (binaryen) and writes THIRD-PARTY-LICENSES.txt. Beside it, on the
      # cores the build leaves idle, the same optimisations with the name section kept, so a crash
      # stack from the site can be read with it (release review §4, P3-06; the wasm as wasm-bindgen
      # made it has names but different function numbers, so it can't): one after the other they
      # took 187 and 152 s, binaryen being one core a file.
      - name: Build, and the wasm with names (for crash stacks)
        working-directory: web
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p .assets/wasm-names
          cp src/core/wasm-pkg/sim_wasm_bg.wasm .assets/wasm-names/sim_wasm_bg.wasm
          cp src/voice/wasm-pkg/voice_wasm_bg.wasm .assets/wasm-names/voice_wasm_bg.wasm
          cargo wasm-opt --names .assets/wasm-names/sim_wasm_bg.wasm .assets/wasm-names/voice_wasm_bg.wasm > .assets/wasm-names.log 2>&1 &
          names=$!
          bunx vite build --base="/$REPO_NAME/"
          status=0
          wait "$names" || status=$?
          cat .assets/wasm-names.log
          if [ "$status" -ne 0 ]; then echo "::error::wasm-opt --names failed"; exit 1; fi

      # Pages publishes at most 1 GB; the voice and language models are most of it.
      - name: Site size
        run: |
          du -h --apparent-size --max-depth=1 web/dist | sort -h
          find web/dist -type f -size +20M -printf '%s\t%p\n' | sort -n
          size=$(du -sm --apparent-size web/dist | cut -f1)
          echo "web/dist: $size MB"
          if [ "$size" -gt 900 ]; then echo "::error::web/dist is $size MB, over the 900 MB kept below Pages' 1 GB limit"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-with-names-${{ github.sha }}
          path: web/.assets/wasm-names/*.wasm
          retention-days: 90

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # CI passed on this commit (see the top). On a tag, the CI run the tag's push started; by hand,
  # the newest CI run on the commit that passed, or else one still running, waited for. A run that
  # fails, or none at all, fails this and the deploy waits on it; the build above runs anyway.
  ci:
    name: CI passed on this commit
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-26.04
    # (The tag's CI is about 20 minutes, the generated worlds the longest.)
    timeout-minutes: 60
    steps:
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            pick="[.workflow_runs[] | select(.event == \"push\" and .head_branch == \"$TAG\")][0].id // empty"
          else
            pick='([.workflow_runs[] | select(.conclusion == "success")] + [.workflow_runs[] | select(.status != "completed")])[0].id // empty'
          fi
          # (A tag's CI run can start a little after this one.)
          id=
          for _ in $(seq 30); do
            id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" --jq "$pick") || id=
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No CI run on $SHA to wait for (a tag: its own CI run; by hand: one that passed or is running)"
            exit 1
          fi
          url="https://github.com/$REPO/actions/runs/$id"
          echo "Waiting for CI: $url"
          errors=0
          while :; do
            if state=$(gh api "repos/$REPO/actions/runs/$id" --jq '"\(.status) \(.conclusion)"'); then
              errors=0
              case "$state" in completed\ *) break ;; esac
            else
              errors=$((errors + 1))
              if [ "$errors" -ge 10 ]; then echo "::error::CI's run can't be read ($url)"; exit 1; fi
            fi
            sleep 30
          done
          echo "CI: ${state#completed } ($url)"
          if [ "$state" != "completed success" ]; then echo "::error::CI on $SHA: ${state#completed } ($url)"; exit 1; fi

  deploy:
    needs: [build, ci]
    # Release tags publish; a run by hand only with deploy checked.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
