<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idyll Lives model inspector</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --panel: #f4f6f8; --line: #d8dde3; --ink: #2f3236; --muted: #6b7178; --accent: #2f6fd6;
        --ok: #2e7d4f; --warn: #a86b00; --fail: #c0392b;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--panel); }
      #app { display: grid; grid-template-columns: 250px 1fr 340px; grid-template-rows: 1fr auto; height: 100%; }
      aside { overflow: auto; background: var(--panel); }
      #list { grid-row: 1 / 3; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
      #panel { grid-column: 3; grid-row: 1 / 3; border-left: 1px solid var(--line); padding: 8px 12px 24px; }
      #view { position: relative; min-width: 0; min-height: 0; background: #9cc2e0; }
      canvas { width: 100%; height: 100%; display: block; outline: none; }

      #back { margin: 8px 10px 0; color: var(--accent); text-decoration: none; font-weight: 600; }
      #back:hover { text-decoration: underline; }
      #search { margin: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
      #models { flex: 1; overflow: auto; padding-bottom: 12px; }
      #models h3 { margin: 10px 10px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      #models button {
        display: flex; gap: 6px; align-items: center; width: 100%; padding: 2px 10px 2px 16px; border: 0; background: none;
        font: inherit; text-align: left; cursor: pointer; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #models button:hover { background: #e6eaee; }
      #models button.on { background: var(--accent); color: #fff; }
      #models button .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
      #models button .dot.clips { background: #e08a2c; }

      #panel h2 { margin: 4px 0 2px; font-size: 15px; word-break: break-all; }
      #panel .sub { color: var(--muted); word-break: break-all; }
      details { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
      summary { font-weight: 600; cursor: pointer; }
      table { border-collapse: collapse; width: 100%; margin-top: 4px; }
      td { padding: 1px 4px 1px 0; vertical-align: top; }
      td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
      tr.row:hover { background: #e6eaee; cursor: pointer; }
      tr.row.on { background: #dbe7fb; }
      pre { margin: 4px 0 0; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 320px; font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
      pre .ok { color: var(--ok); } pre .warn { color: var(--warn); } pre .fail { color: var(--fail); font-weight: 600; }
      .muted { color: var(--muted); }

      .bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      button.pill, select, label.pill {
        font: inherit; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
        background: #fff; cursor: pointer; color: inherit; user-select: none;
      }
      button.pill.on, label.pill:has(input:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
      label.pill input { display: none; }
      kbd { font: 10px ui-monospace, Menlo, monospace; opacity: 0.6; margin-left: 3px; }

      #camera { position: absolute; left: 10px; top: 10px; }
      #camera button.pill { background: rgba(255, 255, 255, 0.85); }
      #camera button.pill.on { background: var(--ink); color: #fff; }
      #toast {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px;
        background: rgba(47, 50, 54, 0.88); color: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      }
      #toast.show { opacity: 1; }
      #drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(47, 111, 214, 0.25); font-size: 18px; font-weight: 600; color: #fff; }
      #drop.show { display: grid; }

      #timeline { grid-column: 2; grid-row: 2; border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
      #scrub { width: 100%; }
      #time { font-variant-numeric: tabular-nums; min-width: 150px; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="list">
        <a id="back" href="./">← Back to the game</a>
        <input id="search" type="search" placeholder="Filter models (/)" autocomplete="off" />
        <div id="models"></div>
      </aside>
      <main id="view">
        <canvas id="c"></canvas>
        <div id="camera" class="bar"></div>
        <div id="toast"></div>
        <div id="drop">Drop a .glb to view it</div>
      </main>
      <section id="timeline">
        <div class="bar" id="clipbar"></div>
        <div class="bar">
          <button class="pill" id="play">Play<kbd>Space</kbd></button>
          <button class="pill" id="rest">Rest<kbd>0</kbd></button>
          <button class="pill" id="open">Open<kbd>9</kbd></button>
          <select id="speed">
            <option value="0.1">0.1×</option>
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
          <label class="pill"><input type="checkbox" id="loop" checked />Loop</label>
          <span id="time" class="muted"></span>
        </div>
        <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" />
      </section>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/debug/inspect.ts"></script>
  </body>
</html>
